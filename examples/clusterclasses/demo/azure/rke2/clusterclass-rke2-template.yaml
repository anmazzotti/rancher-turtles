apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: demo-template-azure-clusterclass
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: RKE2ControlPlaneTemplate
      name: demo-template-rke2-control-plane
    machineInfrastructure:
      ref:
        kind: AzureMachineTemplate
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        name: demo-template-rke2-control-plane
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: AzureClusterTemplate
      name: demo-template-azure-cluster
  workers:
    machineDeployments:
      - class: rke2-default-worker
        namingStrategy:
          template: "{{ .cluster.name }}-{{ .machineDeployment.topologyName }}-{{ .random }}"
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: RKE2ConfigTemplate
              name: demo-template-rke2-default-worker-bootstrap
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: AzureMachineTemplate
              name: demo-template-rke2-default-worker
  variables:
    - name: subscriptionID
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
          turtles-capi.cattle.io/highlight: 'info'

      schema:
        openAPIV3Schema:
          description: "The Azure Subscription ID where the Cluster will be created. The AzureClusterIdentity credentials should be under this subscription."
          type: string
    - name: location
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
      schema:
        openAPIV3Schema:
          description: "The Azure location where the Cluster will be created."
          type: string
          enum:
            - australiaeast
            - francecentral
            - germanywestcentral
            - northcentralus
            - northeurope
            - switzerlandnorth
            - uksouth
            - westeurope
            - westus2
    - name: resourceGroup
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
      schema:
        openAPIV3Schema:
          description: "The Azure Resource Group where the Cluster will be created."
          type: string
    - name: azureClusterIdentityName
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
          turtles-capi.cattle.io/highlight: 'warning'
          turtles-capi.cattle.io/type: 'infrastructure.cluster.x-k8s.io.azureclusteridentity'
      schema:
        openAPIV3Schema:
          description: "The AzureClusterIdentity is a CRD that references a secret containing credentials used to authenticate with Azure. It should be in the same namespace or have allowedNamespaces specified."
          type: string
          default: "cluster-identity"

    - name: registrationMethod
      required: true
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
      schema:
        openAPIV3Schema:
          description: "Registration method to use. Defaults to control-plane endpoint (empty string). Immutable once is set."
          type: string
          default: ""
          enum:
            - internal-first
            - internal-only-ips
            - external-only-ips
            - address
            - control-plane-endpoint
            - ""
    # rke2controlplane.serverConfig.etcd
    # create a toggle component for etcd backup configuration
    - name: toggleEtcdBackup
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/highlight: 'info'
          turtles-capi.cattle.io/label: 'Enable Automatic ETCD Backup'
      schema:
        openAPIV3Schema:
          description: "In RKE2, snapshots are stored on each etcd node. If you have multiple etcd or etcd + control-plane nodes, you will have multiple copies of local etcd snapshots."
          type: boolean
          default: true
    - name: etcdBackupscheduleChron
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "Snapshot interval time in cron spec. eg. every 5 hours '* */5 * * *'"
          type: string
          example: "0 */12 * * *"
    - name: etcdBackupretention
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "Number of snapshots to retain"
          type: string
          example: "5"
    - name: etcdBackupsnapshotName
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "Set the base name of etcd snapshots. Default: etcd-snapshot-<unix-timestamp> (default: \"etcd-snapshot\")"
          type: string
          example: "etcd-snapshot"
    - name: etcdBackupdirectory
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "Directory to save db snapshots. Default location: <data-dir>/db/snapshots"
          type: string
    - name: toggleEtcdS3
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/label: 'Configure S3 data store'
          turtles-capi.cattle.io/highlight: 'info'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "RKE2 supports writing etcd snapshots to and restoring etcd snapshots from systems with S3-compatible APIs. S3 support is available for both on-demand and scheduled snapshots."
          type: boolean
          default: false
    - name: ectdS3endpoint
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
      schema:
        openAPIV3Schema:
          description: "S3 endpoint url"
          type: string
          example: "s3.amazonaws.com"

    - name: etcdS3enforceSslVerify
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
      schema:
        openAPIV3Schema:
          description: "Enforce SSL validation "
          type: boolean
          default: true
    - name: etcdS3endpointCASecret
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
          turtles-capi.cattle.io/type: 'secret'
      schema:
        openAPIV3Schema:
          description: "EndpointCA references the Secret that contains a custom CA that should be trusted to connect to S3 endpoint. The secret must contain a key named \"ca.pem\" that contains the CA certificate."
          type: string
    - name: etcdS3s3CredentialSecret
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
          turtles-capi.cattle.io/type: 'secret'
      schema:
        openAPIV3Schema:
          description: "S3CredentialSecret is a reference to a Secret containing the Access Key and Secret Key necessary to access the target S3 Bucket. The Secret must contain the following keys: \"aws_access_key_id\" and \"aws_secret_access_key\". If empty, the controller will default to IAM authentication"
          type: string
    - name: etcdS3region
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
      schema:
        openAPIV3Schema:
          description: "S3 Region"
          type: string
          example: 'us-east-1'
    - name: etcdS3bucket
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
      schema:
        openAPIV3Schema:
          type: string
    - name: etcdS3folder
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
      schema:
        openAPIV3Schema:
          type: string
    - name: imageGallery
      required: true
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'Azure Machines'
      schema:
        openAPIV3Schema:
          description: "The image Public gallery name."
          type: string
          default: "ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019"
    - name: imageName
      required: true
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'Azure Machines'
      schema:
        openAPIV3Schema:
          description: "The image name"
          type: string
          default: "capi-ubun2-2404"          
    - name: vmSize
      required: true
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'Azure Machines'
      schema:
        openAPIV3Schema:
          description: "The VM size used by machines."
          type: string
          default: "Standard_D2s_v3"
    # this doesn't map to anything in the spec, it just creates a hide-able section in the UI      
    - name: toggleazDisk
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'Azure Machines'
          turtles-capi.cattle.io/label: 'Configure OS Disk'
      schema:
        openAPIV3Schema:
          type: boolean
          default: false
    - name: azdiskSizeGB
      metadata:
        annotations:
          turtles-capi.cattle.io/section: 'Azure Machines'
          turtles-capi.cattle.io/toggled-by: 'toggleazDisk'
      schema:
        openAPIV3Schema:
          description: "Disk Size sets the size in GB of the OS disk. Default: 30GB"
          type: string
          example: 30GB
    - name: azDiskstorageAccountType
      metadata:
        annotations:
          turtles-capi.cattle.io/section: 'Azure Machines'
          turtles-capi.cattle.io/toggled-by: 'toggleazDisk'
          turtles-capi.cattle.io/highlight: 'warning'
      schema:
        openAPIV3Schema:
          description: "Define the operating system disks for Azure machines. WARNING: This requires any updates to ManagedDisk to be manually converted. This is due to the odd issue with conversion-gen where the warning message generated uses a relative directory import rather than the fully qualified import when generating outside of the GOPATH."
          type: string
    - name: azDiskid
      metadata:
        annotations:
          turtles-capi.cattle.io/section: 'Azure Machines'
          turtles-capi.cattle.io/toggled-by: 'toggleazDisk'
      schema:
        openAPIV3Schema:
          description: "Specify the customer-managed disk encryption set resource id for the managed disk"
          type: string
    - name: toggleSpotInstances
      metadata:
        annotations:
          turtles-capi.cattle.io/section: 'Azure Machines'
          turtles-capi.cattle.io/label: 'Configure Spot Instances'
          turtles-capi.cattle.io/highlight: 'info'
      schema:
        openAPIV3Schema:
          description: "Spot instances can offer significant price savings. Machines will be automatically evicted if their cost exceeds the price set below, or if Azure needs the capacity for other, pay-as-you-go workloads. Azure VMs that are deallocated for pricing reasons will not be automatically restarted if the price drops below the maximum."
          type: boolean
    - name: azMaxPrice
      metadata:
        annotations:
          turtles-capi.cattle.io/section: 'Azure Machines'
          turtles-capi.cattle.io/toggled-by: 'toggleSpotInstances'
          turtles-capi.cattle.io/highlight: 'warning'
      schema:
        openAPIV3Schema:
          description: "You will need to scale down any affected machines to change this value. If this is set to -1 VMs wont be evicted for pricing reasons."
          type: string
    - name: azevictionPolicy
      metadata:
        annotations:
          turtles-capi.cattle.io/section: 'Azure Machines'
          turtles-capi.cattle.io/toggled-by: 'toggleSpotInstances'
      schema:
        openAPIV3Schema:
          description: "Define the behavior of the virtual machine when it is evicted."
          type: string
          enum:
          - Delete
          - Deallocate

  
  patches:
    - name: rke2ControlPlaneTemplate
      definitions:
      - jsonPatches:
        - op: add
          path: /spec/template/spec
          valueFrom:
            template: |
              rolloutStrategy:
                type: "RollingUpdate"
                rollingUpdate:
                  maxSurge: 1
              agentConfig: {}
              serverConfig:
                cni: none
                cloudProviderName: external
                disableComponents:
                  kubernetesComponents:
                  - cloudController
                etcd:
                  exposeMetrics: '{{ .etcdexposeMetrics }}'
                  backupConfig:
                    disableAutomaticSnapshots: '{{ .toggleEtcdBackup }}' 
                    snapshotName: '{{ .etcdBackupsnapshotName }}'
                    scheduleCron: '{{ .etcdBackupScheduleChron }}'
                    retention: '{{ .etcdBackupretention }}'
                    directory: '{{ .etcdBackupdirectory }}'
                    s3:
                      endpoint:'{{ .etcdS3endpoint }}'
                      endpointCASecret:'{{ .etcdS3endpointendpointCASecret }}'
                      enforceSslVerify:'{{ .etcdS3enforceSslVerify }}'
                      s3CredentialSecret:'{{ .etcdS3s3CredentialSecret }}'
                      bucket:'{{ .etcdS3bucket }}'
                      region:'{{ .etcdS3region }}'
                      folder:'{{ .etcdS3folder }}'
                kubeAPIServer:
                  extraArgs:
                  - --anonymous-auth=true
              registrationMethod: '{{ .registrationMethod }}'
              files:
                - owner: root:root
                  path: /etc/kubernetes/azure.json
                  permissions: "0644"
                - owner: root:root
                  contentFrom:
                      secret:
                        key: control-plane-azure.json
                        name: "{{ .builtin.controlPlane.machineTemplate.infrastructureRef.name }}-azure-json"
                    path: /etc/kubernetes/azure.json
                    permissions: "0644"
        selector:
          apiVersion: controlplane.cluster.x-k8s.io/v1beta1
          kind: RKE2ControlPlaneTemplate
          matchResources:
            controlPlane: true
    ## initialize azure-specific props on azure machine templates
    ## cp and worker machines            
    - name: azureMachineTemplate
      definitions:
        - jsonPatches:
          - op: add
            path: /spec/template/spec
            valueFrom:
              template: |
                vmSize: '{{ .vmSize }}'
                image:
                  computeGallery: 
                    gallery: '{{ .imageGallery }}'
                    name: '{{ .imageName }}'
                    version: '{{ trimPrefix "v" (trimSuffix "+rke2r1" .builtin.cluster.topology.version) }}'
                osDisk:
                  diskSizeGB: ' {{ .azdiskSizeGB }} '
                  osType: '{{ .azosType }}'
                  managedDisk: 
                    storageAccountType: '{{ .azDiskstorageAccountType }}'
                    diskEncryptionSetParameters:
                      id: '{{ .azDiskid }}'
                  cachingType:'{{ .azcachingType }}'
                sshPublicKey: '{{ .azsshPublicKey }}'
                spotVMOptions:
                  maxPrice: '{{ .azMaxPrice }}'
                  evictionPolicy: '{{ .azevictionPolicy  }}'
          selector: 
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: AzureMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names:
                  - rke2-default-worker
    - name: azureClusterTemplate
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: AzureClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: "/spec/template/spec/subscriptionID"
              valueFrom:
                variable: subscriptionID
            - op: add
              path: "/spec/template/spec/location"
              valueFrom:
                variable: location
            - op: add
              path: "/spec/template/spec/resourceGroup"
              valueFrom:
                variable: resourceGroup
            - op: add
              path: "/spec/template/spec/identityRef/name"
              valueFrom:
                variable: azureClusterIdentityName
            - op: add
              path: "/spec/template/spec/networkSpec/vnet/name"
              valueFrom:
                variable: builtin.cluster.name
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: RKE2ConfigTemplate
metadata:
  name: demo-template-rke2-default-worker-bootstrap
spec:
  template:
    spec: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureClusterTemplate
metadata:
  name: demo-template-azure-cluster
spec:
  template:
    spec:
      identityRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureClusterIdentity
        name: cluster-identity
      networkSpec:
        subnets:
        - name: control-plane-subnet
          role: control-plane
        - name: node-subnet
          natGateway:
            name: node-natgateway
          role: node
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: RKE2ControlPlaneTemplate
metadata:
  name: demo-template-rke2-control-plane
spec:
  template:
  # added viaa patch
    spec: 
      rolloutStrategy:
        type: "RollingUpdate"
        rollingUpdate:
          maxSurge: 1
      agentConfig: {}
      serverConfig:
        cni: none
        cloudProviderName: external
        disableComponents:
          kubernetesComponents:
          - cloudController
        kubeAPIServer:
          extraArgs:
          - --anonymous-auth=true
      files:
        - owner: root:root
          path: /etc/kubernetes/azure.json
          permissions: "0644"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: demo-template-rke2-control-plane
spec:
  template:
    spec:
      image:
        computeGallery: 
          gallery: "TO_BE_REPLACED_BY_PATCH"
          name: "TO_BE_REPLACED_BY_PATCH"
          version: "TO_BE_REPLACED_BY_PATCH"
      osDisk:
        diskSizeGB: 128
        osType: Linux
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: demo-template-rke2-default-worker
spec:
  template:
    spec:
      image:
        computeGallery: 
          gallery: "TO_BE_REPLACED_BY_PATCH"
          name: "TO_BE_REPLACED_BY_PATCH"
          version: "TO_BE_REPLACED_BY_PATCH"
      osDisk:
        diskSizeGB: 30
        osType: Linux
