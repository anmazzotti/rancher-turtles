apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: demo-rich-azure-clusterclass
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: RKE2ControlPlaneTemplate
      name: demo-rich-rke2-control-plane
    machineInfrastructure:
      ref:
        kind: AzureMachineTemplate
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        name: demo-rich-rke2-control-plane
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: AzureClusterTemplate
      name: demo-rich-azure-cluster
  workers:
    machineDeployments:
      - class: rke2-default-worker
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: RKE2ConfigTemplate
              name: demo-rich-rke2-default-worker-bootstrap
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: AzureMachineTemplate
              name: demo-rich-rke2-default-worker
  variables:
    - name: subscriptionID
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
          turtles-capi.cattle.io/highlight: 'info'

      schema:
        openAPIV3Schema:
          description: "The Azure Subscription ID where the Cluster will be created. The AzureClusterIdentity credentials should be under this subscription."
          type: string
    - name: location
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
      schema:
        openAPIV3Schema:
          description: "The Azure location where the Cluster will be created."
          type: string
          enum:
            - australiaeast
            - francecentral
            - germanywestcentral
            - northcentralus
            - northeurope
            - switzerlandnorth
            - uksouth
            - westeurope
            - westus2
    - name: resourceGroup
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
      schema:
        openAPIV3Schema:
          description: "The Azure Resource Group where the Cluster will be created."
          type: string
    - name: azureClusterIdentityName
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
          turtles-capi.cattle.io/highlight: 'info'
          turtles-capi.cattle.io/type: 'infrastructure.cluster.x-k8s.io.azureclusteridentity'
      schema:
        openAPIV3Schema:
          description: "The AzureClusterIdentity is a CRD that references a secret containing credentials used to authenticate with Azure. It should be in the same namespace or have allowedNamespaces specified."
          type: string
          default: "cluster-identity"
    - name: imageGallery
      required: true
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'Custom Section'
      schema:
        openAPIV3Schema:
          description: "The image Public gallery name."
          type: string
          default: "ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019"
    - name: imageName
      required: true
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'Custom Section'
      schema:
        openAPIV3Schema:
          description: "The image name"
          type: string
          default: "capi-ubun2-2404"          
    - name: vmSize
      required: true
      schema:
        openAPIV3Schema:
          description: "The VM size used by machines."
          type: string
          default: "Standard_D2s_v3"
    - name: registrationMethod
      required: true
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
      schema:
        openAPIV3Schema:
          description: "Registration method to use. Defaults to control-plane endpoint (empty string). Immutable once is set."
          type: string
          default: ""
          enum:
            - internal-first
            - internal-only-ips
            - external-only-ips
            - address
            - control-plane-endpoint
            - ""
    # rke2controlplane.serverConfig.etcd
    # create a toggle component for etcd backup configuration
    - name: toggleEtcdBackup
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/highlight: 'info'
          turtles-capi.cattle.io/label: 'Enable Automatic ETCD Backup'
      schema:
        openAPIV3Schema:
          description: "In RKE2, snapshots are stored on each etcd node. If you have multiple etcd or etcd + control-plane nodes, you will have multiple copies of local etcd snapshots."
          type: boolean
          default: true
    - name: etcdBackupScheduleCron
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "Snapshot interval time in cron spec. eg. every 5 hours '* */5 * * *'"
          type: string
          example: "0 */12 * * *"
    - name: etcdBackupRetention
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "Number of snapshots to retain"
          type: string
          example: "5"
    - name: toggleEtcdS3
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/label: 'Configure S3 data store'
          turtles-capi.cattle.io/highlight: 'info'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'

      schema:
        openAPIV3Schema:
          description: "RKE2 supports writing etcd snapshots to and restoring etcd snapshots from systems with S3-compatible APIs. S3 support is available for both on-demand and scheduled snapshots."
          type: boolean
          default: false
    - name: s3EndpointUrl
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
      schema:
        openAPIV3Schema:
          description: "S3 endpoint url"
          type: string
    - name: s3Region
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup,toggleEtcdS3'
      schema:
        openAPIV3Schema:
          description: "S3 Region"
          type: string
          default: 'us-east-1'
  patches:
    - name: rke2ControlPlaneTemplate
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta1
            kind: RKE2ControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: "/spec/template/spec/serverConfig/etcd/backupConfig/disableAutomaticSnapshots"
              valueFrom:
                variable: toggleEtcdBackup
            - op: add
              path: "/spec/template/spec/serverConfig/etcd/backupConfig/scheduleCron"
              valueFrom:
                variable: etcdBackupScheduleCron
            - op: add
              path: "/spec/template/spec/serverConfig/etcd/backupConfig/retention"
              valueFrom:
                variable: etcdBackupRetention
    - name: azureClusterTemplate
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: AzureClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: "/spec/template/spec/subscriptionID"
              valueFrom:
                variable: subscriptionID
            - op: add
              path: "/spec/template/spec/location"
              valueFrom:
                variable: location
            - op: add
              path: "/spec/template/spec/resourceGroup"
              valueFrom:
                variable: resourceGroup
            - op: add
              path: "/spec/template/spec/identityRef/name"
              valueFrom:
                variable: azureClusterIdentityName
            - op: add
              path: "/spec/template/spec/networkSpec/vnet/name"
              valueFrom:
                variable: builtin.cluster.name
    - name: azureMachineTemplate
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta1
            kind: RKE2ControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                    contentFrom:
                      secret:
                        key: control-plane-azure.json
                        name: "{{ .builtin.controlPlane.machineTemplate.infrastructureRef.name }}-azure-json"
                    owner: root:root
                    path: /etc/kubernetes/azure.json
                    permissions: "0644"
            - op: add
              path: /spec/template/spec/registrationMethod
              valueFrom:
                variable: registrationMethod
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: AzureMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names:
                  - rke2-default-worker
          jsonPatches:
            - op: add
              path: "/spec/template/spec/image/computeGallery/gallery"
              valueFrom:
                variable: imageGallery
            - op: add
              path: "/spec/template/spec/image/computeGallery/name"
              valueFrom:
                variable: imageName
            - op: replace
              path: /spec/template/spec/image/computeGallery/version
              valueFrom:
                template: '{{ trimPrefix "v" (trimSuffix "+rke2r1" .builtin.cluster.topology.version) }}'
            - op: add
              path: "/spec/template/spec/vmSize"
              valueFrom:
                variable: vmSize
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: RKE2ConfigTemplate
metadata:
  name: demo-rich-rke2-default-worker-bootstrap
spec:
  template:
    spec: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureClusterTemplate
metadata:
  name: demo-rich-azure-cluster
spec:
  template:
    spec:
      identityRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureClusterIdentity
        name: cluster-identity
      networkSpec:
        subnets:
        - name: control-plane-subnet
          role: control-plane
        - name: node-subnet
          natGateway:
            name: node-natgateway
          role: node
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: RKE2ControlPlaneTemplate
metadata:
  name: demo-rich-rke2-control-plane
spec:
  template:
    spec:
      rolloutStrategy:
        type: "RollingUpdate"
        rollingUpdate:
          maxSurge: 1
      agentConfig: {}
      serverConfig:
        cni: none
        cloudProviderName: external
        disableComponents:
          kubernetesComponents:
          - cloudController
        kubeAPIServer:
          extraArgs:
          - --anonymous-auth=true
      files:
        - owner: root:root
          path: /etc/kubernetes/azure.json
          permissions: "0644"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: demo-rich-rke2-control-plane
spec:
  template:
    spec:
      image:
        computeGallery: 
          gallery: "TO_BE_REPLACED_BY_PATCH"
          name: "TO_BE_REPLACED_BY_PATCH"
          version: "TO_BE_REPLACED_BY_PATCH"
      osDisk:
        diskSizeGB: 128
        osType: Linux
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: demo-rich-rke2-default-worker
spec:
  template:
    spec:
      image:
        computeGallery: 
          gallery: "TO_BE_REPLACED_BY_PATCH"
          name: "TO_BE_REPLACED_BY_PATCH"
          version: "TO_BE_REPLACED_BY_PATCH"
      osDisk:
        diskSizeGB: 30
        osType: Linux
