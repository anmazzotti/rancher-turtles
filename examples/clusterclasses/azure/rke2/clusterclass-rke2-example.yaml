apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: nancys-azure-rke2-example
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: RKE2ControlPlaneTemplate
      name: nancys-rke2-control-plane
    machineInfrastructure:
      ref:
        kind: AzureMachineTemplate
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        name: nancys-rke2-control-plane
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: AzureClusterTemplate
      name: nancys-azure-cluster
  workers:
    machineDeployments:
      - class: rke2-default-worker
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: RKE2ConfigTemplate
              name: nancys-rke2-default-worker-bootstrap
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: AzureMachineTemplate
              name: nancys-rke2-default-worker
  variables:
    - name: subscriptionID
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
      schema:
        openAPIV3Schema:
          description: "The Azure Subscription ID where the Cluster will be created."
          type: string
    - name: location
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
      schema:
        openAPIV3Schema:
          description: "The Azure location where the Cluster will be created."
          type: string
          enum:
            - australiaeast
            - francecentral
            - germanywestcentral
            - northcentralus
            - northeurope
            - switzerlandnorth
            - uksouth
            - westeurope
            - westus2
    - name: resourceGroup
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
      schema:
        openAPIV3Schema:
          description: "The Azure Resource Group where the Cluster will be created."
          type: string
    - name: azureClusterIdentityName
      required: true
      metadata: 
        annotations:
          turtles-capi.cattle.io/section: 'general'
      schema:
        openAPIV3Schema:
          description: "The AzureClusterIdentity resource name referencing the credentials to create the Cluster."
          type: string
          default: "cluster-identity"
    - name: imageGallery
      required: true
      schema:
        openAPIV3Schema:
          description: "The image Public gallery name."
          type: string
          default: "ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019"
    - name: imageName
      required: true
      schema:
        openAPIV3Schema:
          description: "The image name"
          type: string
          default: "capi-ubun2-2404"          
    - name: vmSize
      required: true
      schema:
        openAPIV3Schema:
          description: "The VM size used by machines."
          type: string
          default: "Standard_D2s_v3"
    - name: registrationMethod
      required: true
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
      schema:
        openAPIV3Schema:
          description: "Registration method to use. Defaults to control-plane endpoint (empty string). Immutable once is set."
          type: string
          default: ""
          enum:
            - internal-first
            - internal-only-ips
            - external-only-ips
            - address
            - control-plane-endpoint
            - ""
    # rke2controlplane.serverConfig.etcd
    # create a toggle component for etcd backup configuration
    - name: toggleEtcdBackup
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/label: 'Enable Automatic ETCD Backup'
      schema:
        openAPIV3Schema:
          description: "Configure how RKE2 will back  up ETCD"
          type: boolean
          default: false
    - name: etcdBackupScheduleCron
      required: false
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "Snapshot interval time in cron spec. eg. every 5 hours '* */5 * * *'"
          type: string
          example: "0 */12 * * *"
    - name: etcdBackupRetention
      required: false
      metadata:
        annotations: 
          turtles-capi.cattle.io/section: 'controlplane'
          turtles-capi.cattle.io/group: 'ETCD Backup'
          turtles-capi.cattle.io/toggled-by: 'toggleEtcdBackup'
      schema:
        openAPIV3Schema:
          description: "Number of snapshots to retain"
          type: string
          example: "5"
  patches:
    # - name: rke2ControlPlaneTemplate
    #   definitions:
    #     - selector:
    #         apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    #         kind: RKE2ControlPlaneTemplate
    #         matchResources:
    #           controlPlane: true
    #       jsonPatches:
    #         - op: add
    #           path: "/spec/template/spec/serverConfig/etcd/backupConfig/disableAutomaticSnapshots"
    #           valueFrom:
    #             variable: toggleEtcdBackup
    #         - op: add
    #           path: "/spec/template/spec/serverConfig/etcd/backupConfig/scheduleCron"
    #           valueFrom:
    #             variable: etcdBackupScheduleCron
    #         - op: add
    #           path: "/spec/template/spec/serverConfig/etcd/backupConfig/retention"
    #           valueFrom:
    #             variable: etcdBackupRetention
    - name: azureClusterTemplate
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: AzureClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: "/spec/template/spec/subscriptionID"
              valueFrom:
                variable: subscriptionID
            - op: add
              path: "/spec/template/spec/location"
              valueFrom:
                variable: location
            - op: add
              path: "/spec/template/spec/resourceGroup"
              valueFrom:
                variable: resourceGroup
            - op: add
              path: "/spec/template/spec/identityRef/name"
              valueFrom:
                variable: azureClusterIdentityName
            - op: add
              path: "/spec/template/spec/networkSpec/vnet/name"
              valueFrom:
                variable: builtin.cluster.name
    - name: azureMachineTemplate
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta1
            kind: RKE2ControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                    contentFrom:
                      secret:
                        key: control-plane-azure.json
                        name: "{{ .builtin.controlPlane.machineTemplate.infrastructureRef.name }}-azure-json"
                    owner: root:root
                    path: /etc/kubernetes/azure.json
                    permissions: "0644"
            - op: add
              path: /spec/template/spec/registrationMethod
              valueFrom:
                variable: registrationMethod
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: AzureMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names:
                  - rke2-default-worker
          jsonPatches:
            - op: add
              path: "/spec/template/spec/image/computeGallery/gallery"
              valueFrom:
                variable: imageGallery
            - op: add
              path: "/spec/template/spec/image/computeGallery/name"
              valueFrom:
                variable: imageName
            - op: replace
              path: /spec/template/spec/image/computeGallery/version
              valueFrom:
                template: '{{ trimPrefix "v" (trimSuffix "+rke2r1" .builtin.cluster.topology.version) }}'
            - op: add
              path: "/spec/template/spec/vmSize"
              valueFrom:
                variable: vmSize
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: RKE2ConfigTemplate
metadata:
  name: nancys-rke2-default-worker-bootstrap
spec:
  template:
    spec: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureClusterTemplate
metadata:
  name: nancys-azure-cluster
spec:
  template:
    spec:
      identityRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureClusterIdentity
        name: cluster-identity
      networkSpec:
        subnets:
        - name: control-plane-subnet
          role: control-plane
        - name: node-subnet
          natGateway:
            name: node-natgateway
          role: node
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: RKE2ControlPlaneTemplate
metadata:
  name: nancys-rke2-control-plane
spec:
  template:
    spec:
      rolloutStrategy:
        type: "RollingUpdate"
        rollingUpdate:
          maxSurge: 1
      agentConfig: {}
      serverConfig:
        cni: none
        cloudProviderName: external
        disableComponents:
          kubernetesComponents:
          - cloudController
        kubeAPIServer:
          extraArgs:
          - --anonymous-auth=true
      files:
        - owner: root:root
          path: /etc/kubernetes/azure.json
          permissions: "0644"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: nancys-rke2-control-plane
spec:
  template:
    spec:
      image:
        computeGallery: 
          gallery: "TO_BE_REPLACED_BY_PATCH"
          name: "TO_BE_REPLACED_BY_PATCH"
          version: "TO_BE_REPLACED_BY_PATCH"
      osDisk:
        diskSizeGB: 128
        osType: Linux
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: nancys-rke2-default-worker
spec:
  template:
    spec:
      image:
        computeGallery: 
          gallery: "TO_BE_REPLACED_BY_PATCH"
          name: "TO_BE_REPLACED_BY_PATCH"
          version: "TO_BE_REPLACED_BY_PATCH"
      osDisk:
        diskSizeGB: 30
        osType: Linux
